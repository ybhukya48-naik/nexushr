# Test datasource — H2 in-memory, no PostgreSQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use Hibernate to create schema instead of Flyway (avoids PostgreSQL-specific SQL)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Exclude Redis auto-configuration and Spring AI OpenAI — no live services in unit tests
spring.ai.openai.api-key=test-placeholder
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT configuration for tests only
app.jwt.secret=test-only-nexushr-jwt-secret-key-2026-strong-enough-for-hs256
app.jwt.expiration-minutes=60

# AWS S3 placeholders for context bootstrap in tests
aws.endpoint-url-s3=http://localhost:9000
aws.access-key-id=test-access-key
aws.secret-access-key=test-secret-key
aws.region=us-east-2
aws.s3-bucket=test-bucket
