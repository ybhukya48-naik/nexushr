spring:
  application:
    name: nexushr-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexushr}
    username: ${DB_USER:nexushr}
    password: ${DB_PASSWORD:nexushr_local_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  flyway:
    enabled: true

  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

app:
  jwt:
    secret: ${JWT_SECRET:nexushr-local-dev-secret-key-2026-long-enough-for-hs256}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
