spring:
  application:
    name: nexushr-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:nexushr;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

  show-actuator: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessState:
      enabled: true

    readinessState:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-strong-secret-key-that-is-at-least-32-bytes}
    expiration-minutes: 120

logging:
  level:
    org.springframework.security: DEBUG

