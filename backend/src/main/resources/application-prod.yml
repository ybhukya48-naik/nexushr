server:
  address: 0.0.0.0
  port: ${PORT:10000}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-red-haze-b5nyszma-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1200000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    swagger-enabled: ${SWAGGER_ENABLED:false}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  auth:
    demo-users-enabled: ${DEMO_USERS_ENABLED:true}

aws:
  region: ${AWS_REGION}
  s3-bucket: ${AWS_S3_BUCKET}
  endpoint-url-s3: ${AWS_ENDPOINT_URL_S3}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
