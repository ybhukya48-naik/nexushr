spring:
  config:
    activate:
      on-profile: prod

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    swagger-enabled: ${SWAGGER_ENABLED:false}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

  auth:
    demo-users-enabled: ${DEMO_USERS_ENABLED:false}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
