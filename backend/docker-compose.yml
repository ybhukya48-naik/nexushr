services:

  postgres:
    image: postgres:17-alpine
    container_name: nexushr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexushr
      POSTGRES_USER: nexushr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexushr_local_password}
    ports:
      - "5433:5432"
    volumes:
      - nexushr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexushr -d nexushr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexushr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - nexushr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexushr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:postgresql://postgres:5432/nexushr
      DB_USER: nexushr
      DB_PASSWORD: ${DB_PASSWORD:-nexushr_local_password}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-to-a-strong-32-character-value}
      DEMO_USERS_ENABLED: "true"
      SWAGGER_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175,http://10.72.199.30:5175}

      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  nexushr-postgres-data:
  nexushr-redis-data:
