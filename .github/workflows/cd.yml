name: NexusHR CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nexushr-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nexushr-frontend

jobs:
  publish-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi

          echo "backend_tag=${BACKEND_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

          echo "Using image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha,scope=nexushr-backend
          cache-to: type=gha,mode=max,scope=nexushr-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tag }}
          cache-from: type=gha,scope=nexushr-frontend
          cache-to: type=gha,mode=max,scope=nexushr-frontend

  deploy:
    name: Deploy NexusHR
    needs: publish-images
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: environment
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint ./infra/helm/nexushr

      - name: Render Helm templates
        run: |
          helm template nexushr ./infra/helm/nexushr \
            --set backend.image="${{ needs.publish-images.outputs.backend_tag }}" \
            --set frontend.image="${{ needs.publish-images.outputs.frontend_tag }}"

      - name: Deployment information
        run: |
          echo "Environment: ${{ steps.environment.outputs.name }}"
          echo "Backend image: ${{ needs.publish-images.outputs.backend_tag }}"
          echo "Frontend image: ${{ needs.publish-images.outputs.frontend_tag }}"

      # Kubernetes deployment requires a configured kubeconfig/cluster.
      # Configure KUBE_CONFIG_DATA as a GitHub Actions secret before enabling
      # the kubectl/Helm upgrade step for a real cluster.
