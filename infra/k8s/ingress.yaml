apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexushr-ingress
  namespace: nexushr
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: nexushr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexushr-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexushr-backend
                port:
                  number: 8080
