apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexushr-backend-hpa
  namespace: nexushr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexushr-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexushr-frontend-hpa
  namespace: nexushr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexushr-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
