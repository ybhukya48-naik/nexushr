apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexushr-frontend
  namespace: nexushr
  labels:
    app: nexushr-frontend
    version: "1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexushr-frontend
  template:
    metadata:
      labels:
        app: nexushr-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx default non-root user
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: ghcr.io/zidio-dev/nexushr-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexushr-frontend
  namespace: nexushr
spec:
  selector:
    app: nexushr-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
