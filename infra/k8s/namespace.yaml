apiVersion: v1
kind: Namespace
metadata:
  name: nexushr
  labels:
    name: nexushr
---
# Limit total resource consumption in the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nexushr-quota
  namespace: nexushr
spec:
  hard:
    requests.cpu:    "4"
    requests.memory: "4Gi"
    limits.cpu:      "8"
    limits.memory:   "8Gi"
    pods:            "30"
---
# Default container-level limits (applies when none are set)
apiVersion: v1
kind: LimitRange
metadata:
  name: nexushr-limits
  namespace: nexushr
spec:
  limits:
    - type: Container
      default:
        cpu:    "500m"
        memory: "512Mi"
      defaultRequest:
        cpu:    "100m"
        memory: "128Mi"
---
# Network policy: only allow traffic on defined ports; deny inter-pod by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nexushr
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: nexushr
spec:
  podSelector:
    matchLabels:
      app: nexushr-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexushr-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: nexushr
spec:
  podSelector:
    matchLabels:
      app: nexushr-frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
