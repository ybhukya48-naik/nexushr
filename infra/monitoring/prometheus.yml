global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # NexusHR Spring Boot backend — JVM, HTTP, DB pool, custom metrics
  - job_name: "nexushr-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    # In k8s, replace with kubernetes_sd_configs:
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces: { names: [nexushr] }
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     action: keep
    #     regex: nexushr-backend

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis exporter (add redis-exporter service to docker-compose for this)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
