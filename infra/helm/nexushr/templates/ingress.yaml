apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexushr-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexushr-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexushr-frontend
                port:
                  number: 80
